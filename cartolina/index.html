/* Layout: un tavolo bordeaux su cui accadono tre scene, una alla volta: la busta con la ceralacca, il foglio degli indizi, la cartolina che si gira (e sotto, il taccuino del viaggio). Un solo aspetto, scuro e caldo, come gli altri lavori LBS. */
@font-face { font-family: "Instrument Serif"; font-style: normal; font-weight: 400; font-display: swap; src: url(caratteri/instrument-serif.woff2) format("woff2"); }
@font-face { font-family: "Instrument Serif"; font-style: italic; font-weight: 400; font-display: swap; src: url(caratteri/instrument-serif-corsivo.woff2) format("woff2"); }
@font-face { font-family: "Hanken Grotesk"; font-style: normal; font-weight: 400 600; font-display: swap; src: url(caratteri/hanken-grotesk.woff2) format("woff2"); }
@font-face { font-family: "Caveat"; font-style: normal; font-weight: 400 700; font-display: swap; src: url(caratteri/caveat.woff2) format("woff2"); }
@font-face { font-family: "Josefin Sans"; font-style: normal; font-weight: 300 700; font-display: swap; src: url(caratteri/josefin-sans.woff2) format("woff2"); }
@font-face { font-family: "GFS Didot"; font-style: normal; font-weight: 400; font-display: swap; src: url(caratteri/gfs-didot-greco.woff2) format("woff2"); unicode-range: U+0370-03FF, U+1F00-1FFF; }

:root {
  --tavolo: #22050e;
  --vino: #6b1430;
  --vino-hi: #8f2647;
  --champagne: #efd6b8;
  --avorio: #fbf1f2;
  --tenue: #cfa1ad;
  --carta: #f3e9d8;
  --carta-scura: #e4d5bd;
  --inchiostro: #2e1b26;
  --inchiostro-2: #6a5160;
  --timbro: #5a1a2c;
  --egeo: #1f4e9c;
  --f-display: "Instrument Serif", "Didot", Georgia, serif;
  --f-corpo: "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-mano: "Caveat", "Segoe Print", "Bradley Hand", cursive;
  --f-manifesto: "Josefin Sans", "Futura", "Century Gothic", sans-serif;
  --f-greco: "GFS Didot", "Didot", Georgia, serif;
  --grana: none;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body, main { height: 100%; }
html { background: var(--tavolo); }
body {
  margin: 0;
  background:
    radial-gradient(90% 55% at 15% 0%, rgba(143, 38, 71, .42), transparent 62%),
    radial-gradient(80% 60% at 100% 100%, rgba(107, 20, 48, .5), transparent 60%),
    linear-gradient(165deg, #2c0712 0%, #1a040b 100%) fixed,
    var(--tavolo);
  color: var(--avorio);
  font-family: var(--f-corpo);
  font-size: 17px;
  line-height: 1.55;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
p { margin: 0; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; margin: 0; line-height: 1.05; text-wrap: balance; }
.nascosto { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--champagne); outline-offset: 4px; border-radius: 6px; }

/* ---------- Scene ---------- */
.scena {
  min-height: 100%;
  display: none;
  flex-direction: column; align-items: center; justify-content: center; gap: 22px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 64px 40px;
  text-align: center;
}
.scena.attiva { display: flex; animation: entra .7s cubic-bezier(.2, .7, .2, 1) both; }
.scena.esce { animation: esce .45s ease-in both; }
@keyframes entra { from { opacity: 0; transform: translateY(18px); } }
@keyframes esce { to { opacity: 0; transform: translateY(-14px); } }

.occhiello { font-size: 12px; letter-spacing: .3em; text-transform: uppercase; color: var(--tenue); }
.suggerimento { font-size: 15px; color: var(--tenue); display: inline-flex; align-items: center; gap: 8px; min-height: 24px; }
.suggerimento svg { width: 18px; height: 18px; flex: none; }
.pulsa { animation: pulsa 2.4s ease-in-out infinite; }
@keyframes pulsa { 50% { opacity: .45; } }

/* Interruttore audio */
.audio {
  position: fixed; z-index: 30;
  top: calc(env(safe-area-inset-top, 0px) + 14px);
  right: calc(env(safe-area-inset-right, 0px) + 14px);
  width: 42px; height: 42px; border-radius: 50%;
  border: 1px solid rgba(239, 214, 184, .28); background: rgba(34, 5, 14, .55);
  display: grid; place-items: center; color: var(--champagne);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
.audio svg { width: 20px; height: 20px; }
.audio .off { display: none; }
.audio[aria-pressed="false"] .on { display: none; }
.audio[aria-pressed="false"] .off { display: block; }

/* ---------- Scena 1: la busta ---------- */
.busta-wrap { width: min(86vw, 400px); perspective: 1400px; margin-top: 4vh; }
.busta { position: relative; width: 100%; aspect-ratio: 3 / 2; transform-style: preserve-3d; }
.busta.trema { animation: trema .5s ease-in-out; }
@keyframes trema { 20% { transform: rotate(-1.6deg); } 40% { transform: rotate(1.4deg); } 60% { transform: rotate(-.9deg); } 80% { transform: rotate(.5deg); } }
.busta-fondo {
  position: absolute; inset: 0; border-radius: 5px;
  background:
    repeating-linear-gradient(45deg, rgba(239, 214, 184, .14) 0 2px, transparent 2px 9px),
    repeating-linear-gradient(-45deg, rgba(239, 214, 184, .14) 0 2px, transparent 2px 9px),
    linear-gradient(180deg, #7a1a37, #4d0c1f);
  box-shadow: 0 30px 60px -24px rgba(0, 0, 0, .85), 0 10px 20px -10px rgba(0, 0, 0, .6);
}
.lettera {
  position: absolute; left: 5%; right: 5%; top: 5%; height: 90%; z-index: 2;
  background: var(--grana), linear-gradient(180deg, #fbf5ea, var(--carta));
  border-radius: 3px; color: var(--inchiostro);
  display: grid; align-content: start; justify-items: center; padding-top: 9%;
  transition: transform 1s cubic-bezier(.3, .7, .2, 1);
  box-shadow: 0 -2px 8px rgba(0, 0, 0, .15);
}
.lettera strong { font-family: var(--f-display); font-style: italic; font-weight: 400; font-size: clamp(30px, 9vw, 40px); line-height: 1; }
.lettera span { font-size: 11px; letter-spacing: .28em; text-transform: uppercase; color: var(--inchiostro-2); margin-top: 8px; }
.busta-tasca, .lembo svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.busta-tasca { z-index: 3; }
.busta-nome {
  position: absolute; z-index: 4; left: 0; right: 0; bottom: 11%;
  font-family: var(--f-mano); font-size: clamp(30px, 9vw, 40px); line-height: 1; color: var(--inchiostro); font-weight: 500;
  transition: opacity .4s;
}
.busta-data {
  position: absolute; z-index: 4; left: 0; right: 0; bottom: 4.5%;
  font-size: 10.5px; letter-spacing: .26em; text-transform: uppercase; color: var(--inchiostro-2);
  transition: opacity .4s;
}
.busta-grana { position: absolute; inset: 0; z-index: 5; pointer-events: none; border-radius: 5px; background: var(--grana); mix-blend-mode: multiply; opacity: .55; }
.lembo { position: absolute; left: 0; right: 0; top: 0; height: 52%; z-index: 6; transform-origin: 50% 0; transform-style: preserve-3d; transition: transform .8s cubic-bezier(.5, 0, .25, 1); }
.lembo svg { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.lembo .retro-lembo { transform: rotateX(180deg); }
.busta.aperta .lembo { transform: rotateX(180deg); }
.busta.dentro .lembo { z-index: 1; }
.busta.dentro .busta-nome, .busta.dentro .busta-data { opacity: 0; }
.busta.esce .lettera { transform: translateY(-62%); }
.sigillo {
  position: absolute; z-index: 8; left: 50%; top: 52%; width: 22%; aspect-ratio: 1;
  transform: translate(-50%, -50%); border: 0; padding: 0; background: none; border-radius: 50%;
}
.sigillo .meta-s { position: absolute; inset: 0; transition: transform .7s cubic-bezier(.4, 0, .6, 1), opacity .7s; }
.sigillo .meta-s svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 5px 6px rgba(0, 0, 0, .45)); }
.sigillo .sx { clip-path: polygon(0 0, 54% 0, 47% 22%, 56% 41%, 46% 60%, 54% 79%, 49% 100%, 0 100%); }
.sigillo .dx { clip-path: polygon(54% 0, 100% 0, 100% 100%, 49% 100%, 54% 79%, 46% 60%, 56% 41%, 47% 22%); }
.sigillo:not(:disabled):hover .meta-s, .sigillo:focus-visible .meta-s { transform: scale(1.04); }
.sigillo.rotto .sx { transform: translate(-30%, 60%) rotate(-28deg); opacity: 0; }
.sigillo.rotto .dx { transform: translate(30%, 70%) rotate(24deg); opacity: 0; }
.sigillo.trema { animation: sigillo-no .45s ease-in-out; }
@keyframes sigillo-no { 25% { transform: translate(-50%, -50%) rotate(-9deg); } 75% { transform: translate(-50%, -50%) rotate(7deg); } }
.busta-sotto { min-height: 150px; display: grid; justify-items: center; align-content: start; gap: 12px; }
.attesa { display: grid; gap: 14px; justify-items: center; }
.attesa-titolo { font-family: var(--f-display); font-style: italic; font-size: 26px; color: var(--champagne); }
.conto { display: flex; gap: 6px; font-variant-numeric: tabular-nums; }
.conto div { display: grid; gap: 2px; min-width: 64px; }
.conto b { font-family: var(--f-display); font-weight: 400; font-size: 42px; line-height: 1; color: var(--avorio); }
.conto small { font-size: 10.5px; letter-spacing: .24em; text-transform: uppercase; color: var(--tenue); }
.conto i { font-style: normal; font-family: var(--f-display); font-size: 34px; color: rgba(239, 214, 184, .35); align-self: start; line-height: 1.1; }
.attesa-nota { max-width: 30ch; font-size: 15px; color: var(--tenue); text-wrap: balance; min-height: 3em; }

/* ---------- Scena 2: il foglio degli indizi ---------- */
.foglio {
  position: relative; width: min(100%, 440px);
  background: var(--grana), linear-gradient(180deg, #fbf5ea, var(--carta));
  color: var(--inchiostro); border-radius: 4px;
  padding: 30px 24px 26px;
  box-shadow: 0 30px 60px -28px rgba(0, 0, 0, .85), 0 2px 0 rgba(255, 255, 255, .5) inset;
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; justify-items: center;
}
.foglio .occhiello { color: var(--inchiostro-2); }
.foglio h2 { font-size: clamp(34px, 10vw, 46px); }
.foglio p { max-width: 34ch; text-wrap: pretty; }
.foglio .testo-grande { font-family: var(--f-display); font-size: 22px; line-height: 1.3; }
.tappe { display: flex; gap: 8px; justify-content: center; }
.tappe span { width: 9px; height: 9px; border-radius: 50%; border: 1px solid var(--inchiostro-2); transition: background .4s, transform .4s; }
.tappe span.fatta { background: var(--vino); border-color: var(--vino); }
.tappe span.ora { transform: scale(1.35); border-color: var(--vino); }
.passo { display: grid; gap: 18px; justify-items: center; width: 100%; }
.passo.entra { animation: entra .6s cubic-bezier(.2, .7, .2, 1) both; }
.svela { display: grid; gap: 8px; justify-items: center; opacity: 0; transform: translateY(8px); transition: opacity .7s, transform .7s; min-height: 4.6em; }
.svela.visto { opacity: 1; transform: none; }
.svela .nota { font-size: 14px; color: var(--inchiostro-2); font-style: italic; }
.btn {
  border: 0; border-radius: 999px; padding: 14px 26px; min-height: 48px;
  background: linear-gradient(115deg, #4d0c1f, var(--vino) 40%, var(--vino-hi) 60%, #5a1026);
  color: var(--champagne); font-weight: 500; letter-spacing: .02em;
  box-shadow: 0 10px 24px -12px rgba(60, 8, 22, .9), 0 1px 0 rgba(255, 220, 232, .25) inset;
  transition: transform .2s, opacity .4s;
}
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: 0; pointer-events: none; }
.btn-testo { border: 0; background: none; padding: 8px 6px; font-size: 14px; color: var(--inchiostro-2); text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; }
.scena .btn-testo { color: var(--tenue); }
.foglio .btn-testo { color: var(--inchiostro-2); }

/* Profumo: la carta da strofinare */
.gratta { position: relative; width: 100%; height: 150px; border-radius: 6px; overflow: hidden; background: linear-gradient(180deg, #fff8e8, #f6ecd3); box-shadow: inset 0 0 0 1px rgba(46, 27, 38, .12); }
.gratta-sotto { position: absolute; inset: 0; display: grid; place-items: center; padding: 12px; font-family: var(--f-display); font-style: italic; font-size: 30px; line-height: 1.1; color: var(--vino); text-wrap: balance; }
.gratta canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; transition: opacity .8s; }
.gratta.finito canvas { opacity: 0; pointer-events: none; }

/* Suono: il cerchio da toccare */
.ascolta { position: relative; width: 150px; height: 150px; border-radius: 50%; border: 0; padding: 0; background: radial-gradient(circle at 38% 32%, #2f63b4, var(--egeo) 55%, #12306a); color: #fbf1e3; display: grid; place-items: center; box-shadow: 0 16px 30px -14px rgba(18, 48, 106, .9); }
.ascolta svg { width: 54px; height: 54px; }
.ascolta .onda { position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(31, 78, 156, .5); opacity: 0; pointer-events: none; }
.ascolta.suona .onda { animation: onda 2.4s ease-out infinite; }
.ascolta.suona .onda:nth-child(2) { animation-delay: .8s; }
.ascolta.suona .onda:nth-child(3) { animation-delay: 1.6s; }
@keyframes onda { from { transform: scale(1); opacity: .9; } to { transform: scale(1.45); opacity: 0; } }
.ascolta-nota { font-size: 13px; color: var(--inchiostro-2); }

/* Colore: il ventaglio di campioni */
.ventaglio { position: relative; width: 100%; height: 230px; border: 0; background: none; padding: 0; }
.campione {
  position: absolute; left: 50%; bottom: 8px; width: 96px; height: 184px; margin-left: -48px;
  background: #fffaf0; border-radius: 6px; padding: 6px 6px 0;
  box-shadow: 0 8px 18px -8px rgba(46, 27, 38, .55), 0 0 0 1px rgba(46, 27, 38, .08);
  transform-origin: 50% 92%;
  transition: transform .9s cubic-bezier(.3, 1.3, .4, 1);
  display: grid; grid-template-rows: 1fr auto;
}
.campione i { display: block; border-radius: 3px; }
.campione span { font-size: 11px; line-height: 1.25; letter-spacing: .06em; color: var(--inchiostro); padding: 8px 2px 10px; text-align: left; }
.campione span small { display: block; font-size: 9px; letter-spacing: .18em; text-transform: uppercase; color: var(--inchiostro-2); }
.ventaglio .campione:nth-child(1) { transform: rotate(-3deg); }
.ventaglio .campione:nth-child(2) { transform: rotate(1deg); }
.ventaglio .campione:nth-child(3) { transform: rotate(4deg); }
.ventaglio.aperto .campione:nth-child(1) { transform: translateX(-94px) translateY(4px) rotate(-13deg); }
.ventaglio.aperto .campione:nth-child(2) { transform: translateY(-10px) rotate(0deg); }
.ventaglio.aperto .campione:nth-child(3) { transform: translateX(94px) translateY(4px) rotate(13deg); }

/* Parola: la tessera che si gira */
.tessera-wrap { perspective: 900px; width: min(100%, 290px); }
.tessera { position: relative; width: 100%; aspect-ratio: 290 / 170; border: 0; padding: 0; background: none; transform-style: preserve-3d; transition: transform .9s cubic-bezier(.45, .05, .2, 1); }
.tessera.girata { transform: rotateY(180deg); }
.tessera > div { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 8px; display: grid; place-content: center; gap: 6px; padding: 14px; }
.tessera .t-fronte { background: var(--egeo); color: #fbf1e3; box-shadow: inset 0 0 0 5px var(--egeo), inset 0 0 0 6px rgba(251, 241, 227, .6), 0 14px 26px -14px rgba(18, 48, 106, .9); }
.tessera .t-fronte strong { font-family: var(--f-greco); font-weight: 400; font-size: 46px; line-height: 1; }
.tessera .t-fronte small { font-size: 11px; letter-spacing: .24em; text-transform: uppercase; opacity: .8; }
.tessera .t-retro { transform: rotateY(180deg); background: #fffaf0; color: var(--inchiostro); box-shadow: inset 0 0 0 1px rgba(46, 27, 38, .15), 0 14px 26px -14px rgba(46, 27, 38, .6); }
.tessera .t-retro strong { font-family: var(--f-display); font-style: italic; font-weight: 400; font-size: 34px; line-height: 1; color: var(--egeo); }
.tessera .t-retro small { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--inchiostro-2); }
.tessera .t-retro em { font-style: normal; font-size: 15px; line-height: 1.4; max-width: 28ch; }

/* Indovina */
.indovina { display: grid; gap: 12px; width: 100%; justify-items: center; }
.indovina form { display: flex; gap: 8px; width: 100%; align-items: end; }
.indovina input {
  flex: 1; width: 0; min-width: 0; font: inherit; font-family: var(--f-mano); font-size: 28px; color: var(--inchiostro);
  background: transparent; border: 0; border-bottom: 1.5px solid var(--inchiostro-2); padding: 4px 2px; border-radius: 0;
}
.indovina input::placeholder { color: rgba(106, 81, 96, .55); }
.indovina input:focus { outline: none; border-bottom-color: var(--vino); }
.indovina .btn { padding: 10px 20px; min-height: 44px; }
.esito { min-height: 3em; font-family: var(--f-display); font-size: 21px; line-height: 1.25; color: var(--vino); text-wrap: balance; }

/* ---------- Scena 3: la cartolina ---------- */
#s-cartolina { justify-content: flex-start; padding-top: 70px; }
.cartolina-wrap { width: min(86vw, 400px, calc((100svh - 210px) * .7)); min-width: 240px; perspective: 1700px; }
.cartolina {
  position: relative; width: 100%; aspect-ratio: 7 / 10; transform-style: preserve-3d;
  transform: rotateZ(-1.2deg) rotateY(var(--ry, 0deg));
  transition: transform 1.05s cubic-bezier(.45, .05, .2, 1);
  touch-action: pan-y; cursor: pointer; user-select: none; -webkit-user-select: none;
}
.cartolina.cade { animation: cade 1s cubic-bezier(.2, .8, .25, 1) both; }
@keyframes cade { from { opacity: 0; transform: translateY(-60px) rotateZ(-9deg) scale(1.08); } }
.faccia {
  position: absolute; inset: 0; border-radius: 6px; overflow: hidden; container-type: inline-size;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  box-shadow: 0 34px 60px -26px rgba(0, 0, 0, .9), 0 10px 20px -10px rgba(0, 0, 0, .6);
}
.fronte { transform: rotateY(180deg); background: #f4ead6; padding: 3.4cqw; }
.fronte svg { display: block; width: 100%; height: 100%; border-radius: 2px; }
.grana { position: absolute; inset: 0; pointer-events: none; background: var(--grana); mix-blend-mode: multiply; opacity: .5; }

.retro { background: var(--grana), linear-gradient(170deg, #f8f0e1, #efe2cb); color: var(--inchiostro); }
.r-testa { position: absolute; left: 6cqw; top: 6.5cqw; text-align: left; }
.r-testa b { display: block; font-family: var(--f-manifesto); font-weight: 600; font-size: 3.6cqw; letter-spacing: .32em; color: var(--timbro); }
.r-testa small { display: block; font-size: 2.3cqw; letter-spacing: .2em; text-transform: uppercase; color: var(--inchiostro-2); margin-top: .8cqw; }

function grattaEVinci(cv, fine) {
  const box = cv.parentElement, dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = box.clientWidth, h = box.clientHeight;
  cv.width = w * dpr; cv.height = h * dpr;
  const x = cv.getContext("2d"); x.scale(dpr, dpr);
  const g = x.createLinearGradient(0, 0, w, h); g.addColorStop(0, "#efe0b0"); g.addColorStop(.5, "#e3cf93"); g.addColorStop(1, "#d8c07e");
  x.fillStyle = g; x.fillRect(0, 0, w, h);
  x.strokeStyle = "rgba(255,255,255,.22)"; x.lineWidth = 1;
  for (let i = -h; i < w; i += 7) { x.beginPath(); x.moveTo(i, h); x.lineTo(i + h, 0); x.stroke(); }
  x.strokeStyle = "rgba(90,60,20,.35)"; x.setLineDash([3, 4]); x.strokeRect(8.5, 8.5, w - 17, h - 17); x.setLineDash([]);
  x.fillStyle = "#6a4a1c"; x.textAlign = "center"; x.textBaseline = "middle";
  x.font = "italic 30px 'Instrument Serif', Georgia, serif"; x.fillText("Strofina qui", w / 2, h / 2 - 6);
  x.font = "600 10px 'Hanken Grotesk', Arial, sans-serif";
  x.fillText("CARTA PROFUMATA · N. 1", w / 2, h / 2 + 24);
  x.globalCompositeOperation = "destination-out"; x.lineCap = x.lineJoin = "round"; x.lineWidth = 38;
  let giu = false, ux = 0, uy = 0, mosse = 0, suonato = 0;
  const pos = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  const controlla = () => {
    const d = x.getImageData(0, 0, cv.width, cv.height).data; let vuoti = 0, tot = 0;
    for (let i = 3; i < d.length; i += 4 * 24) { tot++; if (d[i] < 120) vuoti++; }
    if (vuoti / tot > .5) fine();
  };
  cv.addEventListener("pointerdown", e => { giu = true; [ux, uy] = pos(e); cv.setPointerCapture(e.pointerId); Suono.avvia(); x.beginPath(); x.arc(ux, uy, 19, 0, 7); x.fill(); });
  cv.addEventListener("pointermove", e => {
    if (!giu) return; const [nx, ny] = pos(e);
    x.beginPath(); x.moveTo(ux, uy); x.lineTo(nx, ny); x.stroke(); ux = nx; uy = ny;
    if (++mosse % 8 === 0) controlla();
    const t = performance.now(); if (t - suonato > 160) { suonato = t; Suono.carta(.14, .1); }
  });
  const su = () => { if (giu) { giu = false; controlla(); } };
  cv.addEventListener("pointerup", su); cv.addEventListener("pointercancel", su);
}

let x0 = null, y0 = 0, base = 0, trascina = false;

  if (x0 === null) return; const dx = e.clientX - x0, dy = e.clientY - y0;

  O.push(`<g class="nuvole-a">${nuvola(380, 470, 1, "nv")}${nuvola(70, 300, .8, "nv2")}</g><g class="nuvole-b">${nuvola(470, 410, .7, "nv2")}${nuvola(250, 240, .6, "nv")}</g>`);

  // scogliera della caldera, a strati
  let cr = `M-10 1010 L-10 ${CR[0][1]}`; for (let x = -10; x <= 506; x += 8) cr += ` L${x} ${f1(cresta(x))}`; cr += " L506 1010 Z";
  O.push(`<clipPath id="caldera"><path d="${cr}"/></clipPath><path d="${cr}" fill="#9a4632"/>`);
  const strati = [[60, "#b45d40"], [110, "#7a3a2e"], [150, "#c98d5e"], [175, "#4c2833"], [230, "#a9573c"], [290, "#d39a6a"], [330, "#6f3530"], [400, "#b9653f"], [470, "#57303a"]];
  let s = "";
  strati.forEach(([d, col], k) => {
    const sp = 14 + (k % 3) * 9; let p = "M-10 " + f1(cresta(-10) + d);
    for (let x = -10; x <= 520; x += 10) p += ` L${x} ${f1(cresta(Math.min(x, 500)) + d + Math.sin(x / 37 + k) * 4)}`;
    for (let x = 520; x >= -10; x -= 10) p += ` L${x} ${f1(cresta(Math.min(x, 500)) + d + sp + Math.sin(x / 29 + k * 2) * 3)}`;
    s += `<path d="${p} Z" fill="${col}"/>`;
  });
  O.push(`<g clip-path="url(#caldera)">${s}</g>`);

  // il paese: case bianche a gradoni lungo la cresta
  let case_ = "", winN = 0;
  const finestra = (x, y, w, h) => `<rect class="w" x="${f1(x)}" y="${f1(y)}" width="${f1(w)}" height="${f1(h)}" rx="1" style="--d:${f1(3 + R() * 9)}s"/>`;
  const fiori = (x, y) => { let g = ""; for (let i = 0; i < 7; i++) g += `<circle cx="${f1(x + (R() - .5) * 16)}" cy="${f1(y + (R() - .5) * 12)}" r="${f1(2.2 + R() * 2.6)}" fill="${R() < .5 ? "#c8467a" : "#e2709d"}"/>`; return g; };
  const cupole = [[2, 196, 58, true], [0, 292, 50, false], [4, 138, 46, false]];
  for (let k = 0; k < 11; k++) {
    let x = -16 + (k * 23) % 40;
    while (x < 480) {
      const w = 30 + R() * 34, xc = x + w / 2;
      if (k * 30 > profondita(xc) - 10) { x += w; continue; }
      const cup = cupole.find(c => c[0] === k && Math.abs(c[1] - xc) < 34);
      if (R() < .1 && !cup) { x += w * .6; continue; }
      const h = cup ? 46 : 24 + R() * 22, yb = cresta(xc) + k * 30 + 16, y = yb - h;
      if (!cup && x + w > bordo(yb + 4) - 4) { x += w; continue; }
      if (!cup && k < 2 && x < 132 && x + w > 62) { x += w; continue; } // lascia libero il mulino
      if (cup) {
        const W = cup[2], X = cup[1] - W / 2, r = W * .36;
        case_ += `<rect class="cl" x="${f1(X)}" y="${f1(y)}" width="${f1(W)}" height="${f1(h + 4)}"/><rect class="cs" x="${f1(X)}" y="${f1(y)}" width="${f1(W * .26)}" height="${f1(h + 4)}"/>`;
        case_ += `<rect class="cl" x="${f1(cup[1] - r - 3)}" y="${f1(y - 9)}" width="${f1(2 * r + 6)}" height="10"/>`;
        case_ += `<path d="M${f1(cup[1] - r)} ${f1(y - 8)} a${f1(r)} ${f1(r * 1.05)} 0 0 1 ${f1(2 * r)} 0 Z" fill="url(#cupola)"/>`;
        case_ += `<path d="M${f1(cup[1])} ${f1(y - 8 - r * 1.05)} v-12 M${f1(cup[1] - 4)} ${f1(y - 14 - r * 1.05)} h8" stroke="#f5e6c8" stroke-width="2"/>`;
        case_ += `<path d="M${f1(cup[1] - 6)} ${f1(yb - 2)} v-16 a6 6 0 0 1 12 0 v16 Z" fill="#2d5ea6"/>`;
        if (cup[3]) { // campanile con la campana
          const bx = X + W + 2;
          case_ += `<rect class="cl" x="${f1(bx)}" y="${f1(y - 34)}" width="22" height="${f1(h + 38)}"/><rect class="cs" x="${f1(bx)}" y="${f1(y - 34)}" width="6" height="${f1(h + 38)}"/>`;
          case_ += `<path d="M${f1(bx + 5)} ${f1(y - 6)} v-18 a6 6 0 0 1 12 0 v18 Z" fill="#3b2c45"/>`;
          case_ += `<path d="M${f1(bx - 2)} ${f1(y - 34)} h26 M${f1(bx + 4)} ${f1(y - 34)} a7 7 0 0 1 14 0" stroke="#f8efe0" stroke-width="3" fill="#fbf3e4"/>`;
          case_ += `<path d="M${f1(bx + 11)} ${f1(y - 41)} v-9 M${f1(bx + 7.5)} ${f1(y - 46)} h7" stroke="#f5e6c8" stroke-width="1.6"/>`;
          case_ += `<g class="campana-b"><path d="M${f1(bx + 7)} ${f1(y - 9)} q0 -9 4 -10 q4 1 4 10 Z" fill="#d6a24e"/></g>`;
          window.__campana = [bx + 11, y - 19];
        }
        x = X + W + (cup[3] ? 24 : 0); continue;
      }
      case_ += `<rect class="cl" x="${f1(x)}" y="${f1(y)}" width="${f1(w)}" height="${f1(h + 6)}"/><rect class="cs" x="${f1(x)}" y="${f1(y)}" width="${f1(w * .24)}" height="${f1(h + 6)}"/>`;
      const tetto = R();
      if (tetto < .32) case_ += `<path class="cl" d="M${f1(x)} ${f1(y + 1)} a${f1(w / 2)} ${f1(Math.min(10, w / 4))} 0 0 1 ${f1(w)} 0 Z"/>`;
      else if (tetto < .5) case_ += `<rect class="cs" x="${f1(x - 1)}" y="${f1(y - 2)}" width="${f1(w + 2)}" height="3"/>`;
      const nf = w > 46 ? 2 : 1;
      for (let j = 0; j < nf; j++) {
        const fx = x + w * (.36 + j * .34) + (R() - .5) * 4, fy = y + h * .3 + R() * 4;
        if (R() < .28) case_ += `<rect x="${f1(fx - 1.5)}" y="${f1(fy - 1.5)}" width="9" height="11" fill="#2d5ea6"/>`;
        case_ += finestra(fx, fy, 6, 8); winN++;
      }
      if (R() < .25) case_ += `<path d="M${f1(x + w * .62)} ${f1(yb + 6)} v-12 a3.5 3.5 0 0 1 7 0 v12 Z" fill="${R() < .6 ? "#2d5ea6" : "#4d3c56"}"/>`;
      if (R() < .16) case_ += fiori(R() < .5 ? x + 4 : x + w - 4, y + 6);
      x += w + (R() - .5) * 10;
    }
  }
  // mulino a vento sulla cresta
  const mx = 98, my = 404;
  let pale = "";
  for (let i = 0; i < 6; i++) { const a = i * 60; pale += `<g transform="rotate(${a} ${mx} ${my})"><path d="M${mx} ${my} V${my - 56}" stroke="#5a4136" stroke-width="2"/><path d="M${mx + 1} ${my - 14} L${mx + 15} ${my - 20} L${mx + 13} ${my - 54} L${mx + 1} ${my - 54} Z" fill="#f6eadb" opacity=".95"/></g>`; }
  const mulino = `<path class="cl" d="M${mx - 20} 476 L${mx - 16} ${my + 2} H${mx + 16} L${mx + 20} 476 Z"/><path class="cs" d="M${mx - 20} 476 L${mx - 16} ${my + 2} H${mx - 9} L${mx - 11} 476 Z"/>
    <path d="M${mx - 19} ${my + 4} Q${mx} ${my - 26} ${mx + 19} ${my + 4} Z" fill="#8c6a48"/><path d="M${mx - 4} 476 v-16 a4 4 0 0 1 8 0 v16 Z" fill="#2d5ea6"/>${finestra(mx + 4, my + 24, 6, 8)}
    <g class="pale">${pale}<circle cx="${mx}" cy="${my}" r="3.5" fill="#5a4136"/></g>`;
  // lampioni lungo i vicoli
  let lamp = "";
  for (let k = 1; k < 6; k += 2) for (let x = 20 + k * 9; x < 470; x += 46 + R() * 30) {
    const ly = cresta(x) + k * 30 + 22;
    if (k * 30 > profondita(x) - 20 || x > bordo(ly) - 8) continue;
    lamp += `<circle class="lampione" cx="${f1(x)}" cy="${f1(ly)}" r="2.6" fill="#ffe2a0" style="--d:${f1(4 + R() * 8)}s"/>`;
  }
  O.push(`<g>${mulino}${case_}</g><g>${lamp}</g>`);

  // un ramo di buganvillea che entra dall'angolo
  let ramo = `<path d="M712 -6 C668 16 640 26 600 30 C580 32 566 40 552 54" fill="none" stroke="#5b3a2c" stroke-width="3" stroke-linecap="round"/>`;
  [[690, 10], [664, 22], [640, 28], [616, 32], [592, 36], [572, 44], [556, 56]].forEach(([x, y], i) => {
    ramo += `<ellipse cx="${x - 4}" cy="${y + 8}" rx="9" ry="4.5" transform="rotate(${30 + i * 9} ${x - 4} ${y + 8})" fill="#3f6b4a"/>`;
    for (let j = 0; j < 5; j++) ramo += `<circle cx="${f1(x + (R() - .5) * 18)}" cy="${f1(y + 4 + R() * 18)}" r="${f1(3 + R() * 3)}" fill="${R() < .5 ? "#c8467a" : "#e2709d"}"/>`;
  });
  O.push(`<g class="ramo">${ramo}</g>`);

  // titolo, in stile manifesto
  O.push(`<g class="titolo"><text x="352" y="152" text-anchor="middle" font-family="'Josefin Sans', Futura, sans-serif" font-weight="600" font-size="78" letter-spacing="9" fill="#14163b" fill-opacity=".35">${esc(M.nome.toUpperCase())}</text>
    <text x="350" y="149" text-anchor="middle" font-family="'Josefin Sans', Futura, sans-serif" font-weight="600" font-size="78" letter-spacing="9" fill="#fbf1e3">${esc(M.nome.toUpperCase())}</text></g>
    <g class="titolo sottotitolo"><text x="350" y="194" text-anchor="middle" font-family="'Josefin Sans', Futura, sans-serif" font-weight="400" font-size="19" letter-spacing="7" fill="#f8dcb8">${esc(M.luogo.toUpperCase())}</text></g>`);
  return `<svg class="scena-svg" viewBox="0 0 700 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="${esc(M.nome)}: il paese bianco sulla caldera al tramonto, il mare e una barca a vela">${O.join("")}</svg>`;
}

function francobolloSantorini() {
  let fori = "";
  for (let x = 0; x <= 100; x += 8.33) fori += `<circle cx="${x.toFixed(1)}" cy="0" r="3"/><circle cx="${x.toFixed(1)}" cy="124" r="3"/>`;
  for (let y = 8.27; y < 124; y += 8.27) fori += `<circle cx="0" cy="${y.toFixed(1)}" r="3"/><circle cx="100" cy="${y.toFixed(1)}" r="3"/>`;
  return `<svg viewBox="-3 -3 106 130" aria-hidden="true"><defs>
    <linearGradient id="fb-cielo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b4f8e"/><stop offset=".6" stop-color="#e5877a"/><stop offset="1" stop-color="#f7c07a"/></linearGradient>
    <mask id="fb-fori"><rect x="-3" y="-3" width="106" height="130" fill="#fff"/><g fill="#000">${fori}</g></mask></defs>
    <g mask="url(#fb-fori)"><rect x="-3" y="-3" width="106" height="130" fill="#fbf6ec"/>
    <rect x="8" y="8" width="84" height="108" fill="url(#fb-cielo)"/>
    <circle cx="66" cy="72" r="11" fill="#ffe2a0"/>
    <rect x="8" y="78" width="84" height="38" fill="#1c3f7e"/>
    <path d="M8 84 H40 V70 H52 V84 H58 V116 H8 Z" fill="#fbf3e4"/>
    <path d="M14 70 a12 12 0 0 1 24 0 Z" fill="#1f4e9c"/><rect x="13" y="70" width="26" height="14" fill="#fbf3e4"/>
    <path d="M26 58 v-6 M23.5 55 h5" stroke="#fbf3e4" stroke-width="1.4"/>
    <rect x="18" y="74" width="4" height="6" fill="#1f4e9c"/><rect x="30" y="74" width="4" height="6" fill="#1f4e9c"/><rect x="45" y="75" width="3.5" height="5" fill="#1f4e9c"/>
    <text x="50" y="27" text-anchor="middle" font-family="'GFS Didot', Didot, Georgia, serif" font-size="17" letter-spacing="2" fill="#fbf1e3">${esc(M.paese)}</text>
    <text x="50" y="38" text-anchor="middle" font-family="'Josefin Sans', Arial, sans-serif" font-size="6.5" letter-spacing="2.4" fill="#fbf1e3">${esc(M.paeseLatino)}</text>
    <text x="88" y="110" text-anchor="end" font-family="'Josefin Sans', Arial, sans-serif" font-weight="600" font-size="9.5" fill="#fbf1e3">${esc(M.valore)}</text>
    <rect x="8" y="8" width="84" height="108" fill="none" stroke="#fbf6ec" stroke-width="1.2" stroke-opacity=".7"/></g></svg>`;
}
</script>
