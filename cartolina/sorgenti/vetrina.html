<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Vetrina della cartolina</title>
<!-- Composizione usata solo per generare le immagini (anteprima WhatsApp della pagina "Crea" e miniatura del biglietto).
     ?testo aggiunge il titolo a sinistra. Si fotografa con: node sorgenti/anteprima.js -->
<link rel="stylesheet" href="../mete.css">
<style>
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: radial-gradient(90% 70% at 20% 0%, rgba(143, 38, 71, .5), transparent 62%), linear-gradient(165deg, #2c0712, #1a040b); display: flex; align-items: center; justify-content: center; gap: 4vw; overflow: hidden; font-family: "Hanken Grotesk", sans-serif; color: #fbf1f2; }
.coppia { position: relative; height: 82vh; aspect-ratio: 1.25; }
.c { position: absolute; top: 4%; height: 92%; aspect-ratio: 7 / 10; background: #f4ead6; padding: 1.4vh; border-radius: 6px; box-shadow: 0 3vh 6vh -2vh rgba(0, 0, 0, .9); }
.c svg { display: block; width: 100%; height: 100%; border-radius: 2px; }
.c1 { left: 0; transform: rotate(-7deg); }
.c2 { right: 0; transform: rotate(6deg) translateY(2%); }
.testo { display: grid; gap: 2.4vh; max-width: 38vw; }
.testo p { font-size: 2vh; letter-spacing: .32em; text-transform: uppercase; color: #cfa1ad; margin: 0; }
.testo h1 { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; font-size: 10vh; line-height: 1; margin: 0; }
.testo h1 i { color: #efd6b8; }
.testo span { font-size: 3.2vh; color: #cfa1ad; }
</style>
</head>
<body>
<div class="testo" id="testo" hidden><p>LBS · Crea la tua cartolina</p><h1>La cartolina<br><i>che si apre</i></h1><span>Un viaggio a sorpresa, svelato con un gesto.</span></div>
<div class="coppia"><div class="c c1 fermo vivo sera" id="a"></div><div class="c c2 fermo vivo sera" id="b"></div></div>
<script src="../mete.js"></script>
<script>
document.getElementById("a").innerHTML = METE.santorini.scena();
document.getElementById("b").innerHTML = METE.parigi.scena();
if (location.search.includes("testo")) document.getElementById("testo").hidden = false;
</script>
</body>
</html>
